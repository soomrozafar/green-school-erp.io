{% extends 'base.html' %}{% block title %}Grade Scale{% endblock %}{% block content %}<form method="post" class="row g-2 mb-4"><div class="col-md-2"><input class="form-control" name="grade" placeholder="Grade" required></div><div class="col-md-3"><input class="form-control" type="number" step="0.01" name="min_percent" placeholder="Min %" required></div><div class="col-md-3"><input class="form-control" type="number" step="0.01" name="max_percent" placeholder="Max %" required></div><div class="col-md-3"><input class="form-control" name="remarks" placeholder="Remarks"></div><div class="col-md-1"><button class="btn btn-primary">Add</button></div></form><table class="table"><tr><th>Grade</th><th>Range</th><th>Remarks</th></tr>{% for g in grades %}<tr><td>{{g.grade}}</td><td>{{g.min_percent}}% - {{g.max_percent}}%</td><td>{{g.remarks or '-'}}</td></tr>{% endfor %}</table>{% endblock %}
