{% extends "base.html" %}{% block content %}<div class="row g-3 mt-1"><div class="col-lg-4"><form method="post" class="card p-3 shadow-sm"><input class="form-control mb-2" name="name" placeholder="Fee name e.g. Tuition Fee" required><select class="form-select mb-2" name="class_id"><option value="">All classes</option>{% for c in classes %}<option value="{{c.id}}">{{c.name}} - {{c.section}}</option>{% endfor %}</select><select class="form-select mb-2" name="session_id"><option value="">Any session</option>{% for s in sessions %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input class="form-control mb-2" type="number" step="0.01" name="amount" placeholder="Amount" required><select class="form-select mb-2" name="frequency">{% for x in ['Monthly','Quarterly','Term','Annual','One-time'] %}<option>{{x}}</option>{% endfor %}</select><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><button class="btn btn-primary">Save Structure</button></form></div><div class="col-lg-8"><div class="card shadow-sm"><div class="table-responsive"><table class="table mb-0"><tr><th>Name</th><th>Class</th><th>Session</th><th>Amount</th><th>Frequency</th></tr>{% for x in structures %}<tr><td>{{x.name}}</td><td>{{x.class_room.name ~ ' - ' ~ x.class_room.section if x.class_room else 'All'}}</td><td>{{x.session.name if x.session else 'Any'}}</td><td>{{x.amount}}</td><td>{{x.frequency}}</td></tr>{% endfor %}</table></div></div></div></div>{% endblock %}
