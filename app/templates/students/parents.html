{% extends "base.html" %}{% block content %}<div class="row g-3"><div class="col-lg-4"><form method="post" class="card p-3 shadow-sm"><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" name="relation" placeholder="Relation"><input class="form-control mb-2" name="phone" placeholder="Phone"><input class="form-control mb-2" name="email" placeholder="Email"><textarea class="form-control mb-2" name="address" placeholder="Address"></textarea><button class="btn btn-primary">Add Guardian</button></form></div><div class="col-lg-8"><div class="card shadow-sm"><div class="table-responsive"><table class="table mb-0"><tr><th>Name</th><th>Relation</th><th>Phone</th><th>Email</th><th>Children</th></tr>{% for p in parents %}<tr><td>{{p.name}}</td><td>{{p.relation or '-'}}</td><td>{{p.phone or '-'}}</td><td>{{p.email or '-'}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('students.family',parent_id=p.id)}}">View Family ({{p.children|length}})</a></td></tr>{% endfor %}</table></div></div></div></div>{% endblock %}
