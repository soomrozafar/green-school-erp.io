{% extends 'base.html' %}{% block title %}Transport Assignments{% endblock %}{% block content %}<form method="post" class="row g-2 mb-4"><div class="col-md-4"><select class="form-select" name="student_id" required><option value="">Student</option>{% for s in students %}<option value="{{s.id}}">{{s.admission_no}} - {{s.first_name}} {{s.last_name or ''}}</option>{% endfor %}</select></div><div class="col-md-3"><select class="form-select" name="route_id" required>{% for r in routes %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="pickup_point" placeholder="Pickup point"></div><div class="col-md-2"><button class="btn btn-primary">Assign</button></div></form><table class="table table-striped"><tr><th>Student</th><th>Route</th><th>Pickup</th><th>Status</th></tr>{% for a in assignments %}<tr><td>{{a.student.first_name}} {{a.student.last_name or ''}}</td><td>{{a.route.name}}</td><td>{{a.pickup_point}}</td><td>{{a.status}}</td></tr>{% endfor %}</table>{% endblock %}
