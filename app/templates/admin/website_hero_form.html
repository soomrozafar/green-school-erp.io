{% extends "base.html" %}{% block title %}Hero Slide | Website CMS{% endblock %}{% block page_heading %}{{'Edit' if slide else 'Add'}} Hero Slide{% endblock %}{% block content %}<form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm"><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Kicker</label><input class="form-control" name="kicker" value="{{slide.kicker if slide else 'PUBLIC SCHOOL GADAP · KARACHI'}}"></div><div class="col-md-6"><label class="form-label">Order</label><input class="form-control" type="number" name="sort_order" value="{{slide.sort_order if slide else 0}}"></div><div class="col-12"><label class="form-label">Hero Title</label><input class="form-control" name="title" value="{{slide.title if slide else ''}}" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" name="text">{{slide.text if slide else ''}}</textarea></div><div class="col-md-4"><label class="form-label">Button Text</label><input class="form-control" name="button_text" value="{{slide.button_text if slide else 'Explore School'}}"></div><div class="col-md-8"><label class="form-label">Button URL</label><input class="form-control" name="button_url" value="{{slide.button_url if slide else '#about'}}"></div><div class="col-12"><label class="form-label">Hero Image {% if not slide %}*{% endif %}</label><input class="form-control" type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.svg" {% if not slide %}required{% endif %}>{% if slide %}<img class="mt-2 rounded" style="max-width:360px;max-height:180px;object-fit:cover" src="{{url_for('static',filename=slide.image_path)}}">{% endif %}</div><div class="col-12"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_active" value="1" {% if not slide or slide.is_active %}checked{% endif %}> <span class="ms-2">Show this slide on the public website</span></label></div></div></div><div class="card-footer bg-white d-flex gap-2"><button class="btn btn-primary">Save Hero Slide</button><a class="btn btn-outline-secondary" href="{{url_for('admin.website_hero')}}">Cancel</a></div></form>{% endblock %}
