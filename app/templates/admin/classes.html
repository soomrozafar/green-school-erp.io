{% extends "base.html" %}{% block content %}<form method="post" class="card p-3 mb-4"><div class="row g-2"><input class="form-control" name="name" placeholder="Class 5" required><input class="form-control" name="section" placeholder="A" required><input class="form-control" name="capacity" type="number" value="40"><select class="form-select" name="session_id" required>{% for s in sessions %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><button class="btn btn-primary">Add Class</button></div></form><table class="table"><tr><th>Class</th><th>Section</th><th>Capacity</th><th>Session</th></tr>{% for c in classes %}<tr><td>{{c.name}}</td><td>{{c.section}}</td><td>{{c.capacity}}</td><td>{{c.session.name}}</td></tr>{% endfor %}</table>{% endblock %}
